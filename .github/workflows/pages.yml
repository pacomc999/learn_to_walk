# Publishes Walk Studio's browser version (the studio/web folder, nothing to build) to GitHub Pages
# whenever the walk_studio branch changes. Everything runs in the visitor's browser: no server.
name: Publish Walk Studio

on:
  push:
    branches: [walk_studio]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio/web
      - id: deployment
        uses: actions/deploy-pages@v4
